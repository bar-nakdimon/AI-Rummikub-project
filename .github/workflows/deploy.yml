name: CD

# Build the Docker images and publish them to GitHub Container Registry
# (ghcr.io) every time CI passes on main. Images are never built from a
# commit whose tests failed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Allows a manual re-run from the Actions tab.
  workflow_dispatch:

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rummikub-api
            context: api
            dockerfile: api/Dockerfile
          - image: rummikub-backend
            context: .
            dockerfile: backend/Dockerfile
    env:
      # The exact commit CI tested (falls back to the current commit on manual runs).
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Short commit SHA
        id: vars
        run: echo "short_sha=${COMMIT_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.vars.outputs.short_sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
